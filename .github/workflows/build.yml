name: build-media
on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-media
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts==7.0.2 playwright==1.47.0 pillow
          python -m playwright install --with-deps chromium >/dev/null
          npm install --prefix /tmp/rbrfonts @fontsource/montserrat@5.1.0 >/dev/null
      - name: Build pending jobs
        run: |
          set -e
          built=0
          for j in jobs/*.json; do
            [ -e "$j" ] || continue
            out=$(python -c "import json,sys;print(json.load(open('$j'))['out'])")
            if [ ! -e "$out" ]; then python scripts/build_job.py "$j"; built=1; fi
          done
          echo "built=$built" >> $GITHUB_ENV
      - name: Commit outputs
        if: env.built == '1'
        run: |
          git config user.name "teamrbr-bot"
          git config user.email "ryan.butler@kwsa.co.za"
          git add media
          git commit -m "Build media from jobs"
          git push
