name: build-media
on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-media-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Find pending jobs
        run: |
          pending=""; needclip=0
          for j in jobs/*.json; do
            [ -e "$j" ] || continue
            out=$(python -c "import json;print(json.load(open('$j'))['out'])")
            if [ ! -e "$out" ]; then pending="$pending $j"
              python -c "import json,sys;sys.exit(0 if json.load(open('$j')).get('type')=='clip' else 1)" && needclip=1
            fi
          done
          echo "PENDING=$pending" >> $GITHUB_ENV; echo "NEEDCLIP=$needclip" >> $GITHUB_ENV; echo "pending:$pending"
      - name: Install tools
        if: env.PENDING != ''
        timeout-minutes: 15
        run: |
          set -x
          sudo rm -f /var/lib/man-db/auto-update
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          pip install -q gTTS==2.5.4 edge-tts==7.0.2 playwright==1.47.0 pillow
          if [ "$NEEDCLIP" = "1" ]; then pip install -q gdown==5.2.0 faster-whisper==1.1.1; fi
          which ffmpeg || timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null || \
            (timeout 180 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null)
          for i in 1 2 3; do timeout 240 python -m playwright install chromium >/dev/null && break; sleep 10; done
          timeout 180 npm install --prefix /tmp/rbrfonts @fontsource/montserrat@5.1.0 >/dev/null
      - name: Build pending jobs
        if: env.PENDING != ''
        timeout-minutes: 22
        run: |
          set -e
          built=0
          for j in $PENDING; do
            out=$(python -c "import json,sys;print(json.load(open('$j'))['out'])")
            if [ ! -e "$out" ]; then
              mkdir -p logs
              if timeout 1200 python -u scripts/build_job.py "$j" > logs/last-build.log 2>&1; then built=1; else
                cp logs/last-build.log "logs/FAILED-$(basename "$j" .json).log"; built=1; fi
            fi
          done
          echo "built=$built" >> $GITHUB_ENV
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "teamrbr-bot"
          git config user.email "ryan.butler@kwsa.co.za"
          for d in media logs brand; do [ -d "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -m "Build media from jobs"
          git push
