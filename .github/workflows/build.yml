name: build-media
on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-media-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tools
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts==7.0.2 gTTS==2.5.4 playwright==1.47.0 pillow
          for i in 1 2 3; do python -m playwright install --with-deps chromium >/dev/null && break; sleep 10; done
          npm install --prefix /tmp/rbrfonts @fontsource/montserrat@5.1.0 >/dev/null
      - name: Build pending jobs
        timeout-minutes: 11
        run: |
          set -e
          built=0
          for j in jobs/*.json; do
            [ -e "$j" ] || continue
            out=$(python -c "import json,sys;print(json.load(open('$j'))['out'])")
            if [ ! -e "$out" ]; then
              mkdir -p logs
              if timeout 600 python -u scripts/build_job.py "$j" > logs/last-build.log 2>&1; then built=1; else
                cp logs/last-build.log "logs/FAILED-$(basename "$j" .json).log"; built=1; fi
            fi
          done
          echo "built=$built" >> $GITHUB_ENV
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "teamrbr-bot"
          git config user.email "ryan.butler@kwsa.co.za"
          for d in media logs; do [ -d "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -m "Build media from jobs"
          git push
